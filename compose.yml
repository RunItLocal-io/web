# runitlocal.io and its tunnel, on runitlocal-web (DMZ, SV10 CT 12076). `web`
# publishes no port: cloudflared reaches it on the compose network as
# http://web:3000, so nothing on the plane can. TUNNEL_TOKEN and the /admin login
# (OIDC_CLIENT_ID, OIDC_CLIENT_SECRET of authentik's runitlocal-admin, and
# SESSION_SECRET) come from .env beside this file (root, 600). The
# volume is still called rigs from the old leaderboard; it holds the podcast
# list and the submissions queue, so it keeps its name.
name: runitlocal
services:
  web:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - SESSION_SECRET
    volumes:
      - rigs:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
  tunnel:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN
    restart: unless-stopped
    depends_on: [web]
    profiles: [tunnel]

volumes:
  rigs:
